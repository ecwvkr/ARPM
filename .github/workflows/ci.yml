# 푸시·PR마다 타입·린트·빌드와 DB가 필요 없는 회귀 검사를 돌린다.
#
# DB를 쓰는 검사(check:join 등)는 여기서 돌리지 않는다. 지금은 개발과 운영이 같은 DB를
# 쓰고, 그중 일부는 쓰고 지우기까지 한다 — CI가 운영 DB에 접속하게 하지 않는다.
# 개발용 DB를 분리하면(docs/BACKLOG.md O1) 그때 붙인다.
#
# 비밀 값은 하나도 넣지 않는다. 빌드는 환경변수 없이도 통과해야 한다(페이지가 전부
# 요청 시 렌더라 빌드 중 DB에 접속하지 않는다).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall이 Prisma Client를 만든다(lib/generated는 저장소에 없다).
      - run: npm ci

      # PageProps 같은 라우트 타입은 next dev/build가 만든다. 빈 환경에서 tsc를 먼저
      # 돌리면 "Cannot find name 'PageProps'"로 실패한다(로컬은 dev 서버가 이미 만들어 둬서
      # 안 보인다). typegen이 그것만 만든다.
      - name: 타입 검사
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: 린트
        run: npx eslint

      - name: 회귀 검사 (DB 없음)
        run: |
          npm run check:crop
          npm run check:linkify
          npm run check:date-input
          npm run check:login
          npm run check:trash

      - name: 빌드
        run: npx next build
